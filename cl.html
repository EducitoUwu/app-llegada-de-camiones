<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centro Logístico — Llegada de camiones</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="pagina-form">
  <main class="contenedor">
    <a class="volver" href="index.html">← Inicio</a>
    <h1>Centro Logístico</h1>
    <p class="sub">Toca la cantidad de pallets del camión que sale a recepción. Llega al CD en ~<span id="minutos-cl"></span> min.</p>

    <div id="botones" class="botones"></div>

    <form id="form-otro" class="otro">
      <input id="otro" type="number" min="1" max="60" placeholder="Otra cantidad" />
      <button type="submit">Enviar</button>
    </form>

    <p id="mensaje" class="mensaje" role="status"></p>
  </main>
  <script type="module" src="js/cl.js"></script>
</body>
</html>
