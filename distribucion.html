<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Distribución — Llegada de camiones</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="pagina-form">
  <header class="barra"><a href="index.html">← Inicio</a></header>
  <main class="contenedor">
    <h1>Distribución</h1>
    <p class="sub">Informa el próximo camión que viene a recargue.</p>

    <form id="form" class="tarjeta-form" autocomplete="off">
      <div class="campo">
        <label for="camion">N° de camión</label>
        <div class="con-prefijo">
          <span class="prefijo">E-</span>
          <input id="camion" required maxlength="15" placeholder="46" inputmode="numeric" />
        </div>
      </div>
      <div class="campo">
        <label for="ubicacion">Ubicación actual</label>
        <div class="fila">
          <input id="ubicacion" required maxlength="200" placeholder="Dirección, comuna o coordenadas" />
          <button id="buscar" type="button" class="boton-secundario">Buscar</button>
        </div>
        <div id="mapa" class="mapa"></div>
        <p class="nota">Busca la dirección o toca el mapa donde está el camión. Puedes arrastrar el marcador para corregirlo.</p>
      </div>
      <div id="bloque-manual" hidden>
        <label>Minutos estimados de llegada
          <input id="minutos" type="number" min="1" max="600" placeholder="Ej: 25" />
        </label>
        <p id="nota-manual" class="nota"></p>
      </div>
      <button id="enviar" class="boton-principal" type="submit">Calcular y enviar</button>
      <p id="mensaje" class="mensaje" role="status"></p>
    </form>

    <h2>Avisos enviados</h2>
    <ul id="lista" class="lista"></ul>
  </main>
  <script type="module" src="js/distribucion.js"></script>
</body>
</html>
